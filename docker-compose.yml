services:
  lb:
    image: ghcr.io/rafaelcoelhox/detecta-fraude-lb:20260605121203
    container_name: detecta-lb
    platform: linux/amd64
    cpuset: "2,3"
    ports:
      - "9999:9999"
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      LB_PORT: "9999"
      LB_BACKLOG: "65535"
      LB_ACCEPT_BATCH: "128"
      API_SOCKETS: "/sockets/api1-w0.sock,/sockets/api2-w0.sock"
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    logging:
      driver: none
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.04"
          memory: "20MB"

  api1:
    image: ghcr.io/rafaelcoelhox/detecta-fraude-api:20260605121203
    container_name: detecta-api1
    platform: linux/amd64
    cpuset: "0"
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      API_SOCKET_PREFIX: "/sockets/api1"
    logging:
      driver: none
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.48"
          memory: "165MB"

  api2:
    image: ghcr.io/rafaelcoelhox/detecta-fraude-api:20260605121203
    container_name: detecta-api2
    platform: linux/amd64
    cpuset: "1"
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      API_SOCKET_PREFIX: "/sockets/api2"
    logging:
      driver: none
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.48"
          memory: "165MB"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"
