services:
  lb:
    image: ghcr.io/rafaelcoelhox/detecta-fraude-lb:latest
    container_name: detecta-lb
    platform: linux/amd64
    ports:
      - "9999:9999"
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      LB_PORT: "9999"
      LB_BACKLOG: "8192"
      API_SOCKETS: "/sockets/api1-w0.sock,/sockets/api2-w0.sock,/sockets/api1-w1.sock,/sockets/api2-w1.sock"
    depends_on:
      api1:
        condition: service_started
      api2:
        condition: service_started
    logging:
      driver: none
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "28MB"

  api1:
    image: ghcr.io/rafaelcoelhox/detecta-fraude-api:latest
    container_name: detecta-api1
    platform: linux/amd64
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      API_SOCKET_PREFIX: "/sockets/api1"
      API_WORKERS: "2"
      INDEX_PATH: "/index/index.bin"
    logging:
      driver: none
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    image: ghcr.io/rafaelcoelhox/detecta-fraude-api:latest
    container_name: detecta-api2
    platform: linux/amd64
    networks:
      - rinha
    volumes:
      - sockets:/sockets
    environment:
      API_SOCKET_PREFIX: "/sockets/api2"
      API_WORKERS: "2"
      INDEX_PATH: "/index/index.bin"
    logging:
      driver: none
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=0,mode=0777"
